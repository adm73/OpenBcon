name: openbcon

services:
  postgres:
    image: postgres:17-alpine
    container_name: bconomics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DBOB_DATABASE_PREFIX:-dbob1234567890}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bconomics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bconomics-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:8
    container_name: bconomics-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${DBOB_DATABASE_PREFIX:-dbob1234567890}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - bconomics-mongodb-data:/data/db

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: bconomics-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - bconomics-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-model:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: bconomics-ollama-model
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-smollm2:135m}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${OLLAMA_MODEL}\""]
    volumes:
      - bconomics-ollama-data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  bconomics-postgres-data:
  bconomics-mongodb-data:
  bconomics-ollama-data:
