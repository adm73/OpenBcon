services:
  postgres:
    image: postgres:17-alpine
    container_name: bconomics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bconomics
      POSTGRES_USER: bconomics
      POSTGRES_PASSWORD: bconomics
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bconomics-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bconomics -d bconomics"]
      interval: 3s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:8
    container_name: bconomics-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: bconomics
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - bconomics-mongodb-data:/data/db

volumes:
  bconomics-postgres-data:
  bconomics-mongodb-data:
