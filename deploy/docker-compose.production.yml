name: openbcon

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dbob1234567890}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}
    volumes:
      - bconomics-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-dbob1234567890}
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?Set MONGODB_ROOT_PASSWORD in deploy/.env.production}
    volumes:
      - bconomics-mongodb-data:/data/db

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - bconomics-ollama-data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-model:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-smollm2:135m}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${OLLAMA_MODEL}\""]
    volumes:
      - bconomics-ollama-data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        VITE_BUSINESS_PLAN_API_URL: /ai-api
        VITE_COMMERCIAL_LICENSED: ${VITE_COMMERCIAL_LICENSED:-false}
        VITE_APP_COMMIT: ${VITE_APP_COMMIT:-unknown}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-unreleased}
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dbob1234567890}
      MONGODB_URL: mongodb://${MONGODB_ROOT_USERNAME:-admin}:${MONGODB_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      API_HOST: 0.0.0.0
      API_PORT: 8787
      NODE_ENV: production
      CORS_ORIGIN: https://${DOMAIN}
      AUTO_MIGRATE: "true"
      SEED_DEMO_DATA: "false"
      OPENBCON_BUILD_COMMIT: ${VITE_APP_COMMIT:-unknown}
      OPENBCON_BUILD_VERSION: ${VITE_APP_VERSION:-unreleased}
      OPENBCON_UPDATE_AGENT_URL: http://updater:8788
      OPENBCON_UPDATE_TOKEN: ${OPENBCON_UPDATE_TOKEN:?Set OPENBCON_UPDATE_TOKEN in deploy/.env.production}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
    expose:
      - "8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20

  python:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python
    env_file:
      - .env.production
    environment:
      OPENBCON_DB_DSN: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dbob1234567890}
      OPENBCON_MONGODB_URL: mongodb://${MONGODB_ROOT_USERNAME:-admin}:${MONGODB_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      OPENBCON_MONGODB_DATABASE: ${MONGODB_DATABASE:-dbob1234567890}
      OPENBCON_CORS_ORIGINS: https://${DOMAIN}
      OPENBCON_API_HOST: 0.0.0.0
      OPENBCON_API_PORT: 8010
      OPENBCON_RUNTIME_ENV: production
      OPENBCON_OLLAMA_BASE_URL: ${OPENBCON_OLLAMA_BASE_URL:-http://ollama:11434}
      OPENBCON_OLLAMA_MODEL: ${OLLAMA_MODEL:-smollm2:135m}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
    expose:
      - "8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN=your-domain.example in deploy/.env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Use the host checkout path because the update agent runs Compose from
      # inside a container while Docker creates the Caddy container on the host.
      - "${OPENBCON_ROOT:-/opt/openbcon}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
      python:
        condition: service_healthy

  updater:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.updater
    restart: unless-stopped
    environment:
      OPENBCON_CHECKOUT_ROOT: /workspace
      OPENBCON_UPDATE_TOKEN: ${OPENBCON_UPDATE_TOKEN:?Set OPENBCON_UPDATE_TOKEN in deploy/.env.production}
      UPDATE_AGENT_BIND_ADDRESS: 0.0.0.0
      UPDATE_AGENT_PORT: 8788
    volumes:
      - ${OPENBCON_ROOT:-/opt/openbcon}:/workspace:rw
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8788"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "--header", "X-OpenBcon-Update-Token: ${OPENBCON_UPDATE_TOKEN}", "http://127.0.0.1:8788/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  bconomics-postgres-data:
    name: deploy_bconomics-postgres-data
  bconomics-mongodb-data:
    name: deploy_bconomics-mongodb-data
  bconomics-ollama-data:
    name: deploy_bconomics-ollama-data
  caddy-data:
    name: deploy_caddy-data
  caddy-config:
    name: deploy_caddy-config
